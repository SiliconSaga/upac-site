      start: "17:30"
    - level: Hip Hop 4
      who: 9th – 12th grade
      day: Monday
      time: 7:45 – 8:45 pm
      start: "19:45"

- id: ballet
  name: Ballet
  ages: 2nd – 12th grade
  age_group: elementary tween-teen
  length: 1 – 1½ hours
  description: Students start by learning the vocabulary and positions of classical ballet. A sensible and fun approach is used to teach correct placement and alignment, which provides an excellent foundation. Students progress to exercises at the barre and in center aimed at improving balance, control and coordination, and learn spatial awareness, dynamics and artistry of movement. Exercises are created to enhance each student's individual qualities, raise their technical level, and focus on healthy technique to create strong and flexible bodies.
  schedule:
    - level: Intermediate
      who: 2nd grade (after Combo II) – 4th grade
      day: Thursday
      time: 5:30 – 6:30 pm
      start: "17:30"
    - level: Beginner
      who: 5th – 12th grade, little to no experience
      day: Thursday
      time: 6:30 – 7:30 pm
      start: "18:30"
    - level: Youth
      who: 5th – 8th grade, with experience
      day: Thursday
      time: 7:30 – 9:00 pm
      start: "19:30"
    - level: Teen
      who: 9th – 12th grade, with experience
      day: Thursday
      time: 7:30 – 9:00 pm
      start: "19:30"

- id: jazz
  name: Jazz
  ages: 2nd – 12th grade
  age_group: elementary tween-teen
  length: 1 – 1½ hours
  description: Every class begins with a warm-up and stretches concentrating on correct placement, followed by across-the-floor progressions of leaps, turns, kicks and jumps. Class concludes with a stylistically challenging combination in one of the jazz styles — lyrical, contemporary, modern or street jazz. It is a high-energy class that promises to be fun-filled!
  schedule:
    - level: Intermediate
      who: 2nd grade (after Combo II) – 4th grade
      day: Thursday
      time: 4:30 – 5:30 pm
      start: "16:30"
    - level: Youth
      who: 5th – 8th grade, with experience
      day: Tuesday
      time: 4:30 – 6:00 pm
      start: "16:30"
    - level: Beginner
      who: 5th – 12th grade, little to no experience
      day: Tuesday
      time: 6:30 – 7:30 pm
      start: "18:30"
    - level: Teen
      who: 9th – 12th grade, with experience
      day: Tuesday
      time: 7:30 – 9:00 pm
      start: "19:30"

- id: tap
  name: Tap
  ages: 2nd grade – adult
  age_group: elementary tween-teen adult
  length: 1 hour
  description: Dancers use their feet like drums to create rhythmic patterns and timely beats, and are exposed to various styles of tap including Broadway, classical and hoofing. A dancer learns a series of basic steps and builds more difficulty into the combinations, speed and rhythmic patterns as they advance. The objective is to produce clean, clear sounds while stylizing the upper body.
  schedule:
    - level: Intermediate
      who: 2nd grade (after Combo II) – 4th grade
      day: Wednesday
      time: 4:45 – 5:45 pm
      start: "16:45"
    - level: Beginner
      who: 5th – 12th grade, little to no experience
      day: Monday
      time: 5:45 – 6:45 pm
      start: "17:45"
    - level: Youth
      who: 5th – 8th grade, with experience
      day: Monday
      time: 6:45 – 7:45 pm
      start: "18:45"
    - level: Teen
      who: 9th – 12th grade, with experience
      day: Monday
      time: 6:45 – 7:45 pm
      start: "18:45"
    - level: Adult
      who: Mixed level
      day: Monday
      time: 7:45 – 8:45 pm
      start: "19:45"

- id: musical-theater
  name: Musical Theater
  ages: 1st – 4th grade
  age_group: elementary
  length: 1 hour
  description: Lights, camera, action! This fun and engaging class introduces young performers to the exciting world of musical theater. Students build confidence while exploring the fundamentals of acting, singing and dance through age-appropriate songs, scenes, games and creative activities. Emphasis is placed on stage presence, character development, expression, teamwork and performance skills in a positive and encouraging environment. No previous experience is required — just bring your imagination and a love of performing!
  schedule:
    - day: Friday
      time: 5:30 – 6:30 pm
      start: "17:30"

- id: pointe
  name: Pointe
  ages: By placement only
  age_group: tween-teen
  length: Scheduled at placement
  description: Students must take two ballet classes per week. In order to dance en pointe, a dancer must have had time to achieve the form, strength, turnout, balance and alignment needed to make a successful transition into pointe work. Proper technique is required to rise onto the toes without risk of injury. Students are evaluated to determine whether they are physically ready to meet the demands of pointe work.
  schedule: []
