# Photo strip on the Troupe page. Files live in assets/img/troupe/. To add one:
# drop the image in the folder, add an entry with a one-line caption and an
# alt text that says what is in the photo for someone who cannot see it.
#
# News and event pictures are not here any more: each is a post in _posts/
# with its image under assets/news/<slug>/ (see README, "News posts").

troupe:
  - file: troupe-2025-26.jpg
    caption: The UPAC Troupe, 2025–2026
    alt: The full UPAC Troupe in black team jackets covered in competition pins, posed in the studio
    wide: true
  - file: troupe-minis.jpg
    caption: Meet the Minis
    alt: The youngest Troupe dancers posing at the barre
  - file: troupe-petites.jpg
    caption: Meet the Petites
    alt: Troupe Petites posing together in the studio
  - file: troupe-juniors.jpg
    caption: Meet the Juniors
    alt: Troupe Juniors sitting in a row against the blue studio wall
  - file: troupe-teens.jpg
    caption: Meet the Teens
    alt: Troupe Teens posing in the studio
