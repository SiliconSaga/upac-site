# Photos and social-post graphics. Files live in assets/img/gallery/ and
# assets/img/troupe/. To add one: drop the image in the folder, add an entry
# at the TOP of the list (newest first), write a one-line caption.
#
# `home` feeds the "What's happening" grid on the home page (first 8 show)
# and nothing else; `troupe` is the photo strip on the Troupe page.

