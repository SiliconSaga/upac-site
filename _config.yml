title: Unique Performance Arts Center
short_title: UPAC
tagline: Dedicated to excellence in the performing arts
description: >-
  Unique Performance Arts Center (UPAC) — dance and musical theater classes for
  ages 18 months through adult in West Orange, NJ. Ballet, tap, jazz, hip hop,
  creative movement and the award-winning UPAC Troupe. Established 1998.

# Served as a project page until the owner points uniquepac.com here. Every
# internal link and asset path goes through `relative_url`, so moving to the
# custom domain is this one line back to "" plus a CNAME file (see README).
url: "https://siliconsaga.github.io"
baseurl: /upac-site

# Base for the "Suggest an edit" link in the footer: the page's source path is
# appended and lands in GitHub's editor for that file. Update if the repo moves.
github_edit_base: "https://github.com/SiliconSaga/upac-site/edit/main/"

permalink: pretty
markdown: kramdown

# News posts live in _posts/ (one Markdown file per post, images under
# assets/news/<slug>/) and render at /news/<year>/<slug>/. jekyll-feed builds
# /feed.xml from them; news/feed.json is the JSON Feed.
plugins:
  - jekyll-feed
feed:
  posts_limit: 20

sass:
  sass_dir: _sass
  style: compressed

# Staff bios: one file per instructor under _staff/, each rendered at
# /staff/<name>/. The Staff page lists them in `order:` order.
collections:
  staff:
    output: true
    permalink: /staff/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: staff
    values:
      layout: staff
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /news/:year/:slug/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - LICENSE
  - vendor
  - node_modules
  - _docs
