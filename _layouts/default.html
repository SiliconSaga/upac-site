<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.short_title }}{% else %}{{ site.title }} · West Orange, NJ{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title and page.url != '/' %}{{ page.title }} · {{ site.short_title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <meta property="og:image" content="{{ page.image | default: '/assets/img/og-card.jpg' | absolute_url }}">
  {% feed_meta %}
  <link rel="alternate" type="application/feed+json" title="{{ site.title }} news (JSON Feed)" href="{{ '/news/feed.json' | absolute_url }}">
  <meta name="theme-color" content="#0a162b">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/header.js' | relative_url }}" defer></script>
</head>
<body class="{% if page.url == '/' %}is-home{% endif %}">
  {% include header.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
