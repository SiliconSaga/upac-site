{%- comment -%} Post date; month only when the post is marked date_approximate. Usage: {% include post-date.html post=post %} {%- endcomment -%}
{%- assign p = include.post -%}
<time datetime="{{ p.date | date_to_xmlschema }}">{% if p.date_approximate %}{{ p.date | date: "%B %Y" }}{% else %}{{ p.date | date: "%B %-d, %Y" }}{% endif %}</time>
